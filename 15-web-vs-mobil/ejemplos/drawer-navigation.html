<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Drawer navigation</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #ffffff;
        font-family: system-ui, sans-serif;
        font-size: 18px;
        color: #111827;
        width: 1200px;
        height: 640px;
        overflow: hidden;
      }
      .compare {
        display: flex;
        height: 640px;
      }
      .half {
        flex: 1;
        padding: 20px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .half + .half {
        border-left: 1px solid #e5e7eb;
      }
      .badge {
        align-self: flex-start;
        padding: 4px 16px;
        border-radius: 999px;
        font-weight: 600;
      }
      .bad {
        background: #fee2e2;
        color: #b91c1c;
      }
      .good {
        background: #dcfce7;
        color: #15803d;
      }
      .neutral {
        background: #e5e7eb;
        color: #374151;
      }
      .phone {
        position: relative;
        width: 280px;
        height: 500px;
        margin-top: 12px;
        border: 8px solid #111827;
        border-radius: 36px;
        overflow: hidden;
        background: #ffffff;
        display: flex;
        flex-direction: column;
      }
      .header {
        padding: 14px 16px;
        border-bottom: 1px solid #e5e7eb;
        font-weight: 700;
      }
      .content {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .item {
        padding: 14px;
        border-radius: 12px;
        background: #f3f4f6;
      }
      .line {
        height: 14px;
        background: #f3f4f6;
        border-radius: 6px;
      }
      .line.short {
        width: 60%;
      }
      .hero {
        height: 110px;
        background: #e5e7eb;
        border-radius: 12px;
      }
      .tabs {
        display: flex;
        margin-top: auto;
        border-top: 1px solid #e5e7eb;
        background: #f3f4f6;
      }
      .tabs span {
        flex: 1;
        text-align: center;
        font-size: 14px;
        padding: 14px 0;
        color: #6b7280;
      }
      .tabs .active {
        color: #2563eb;
        font-weight: 700;
      }
      .caption {
        margin-top: auto;
        color: #6b7280;
        font-size: 22px;
        align-self: flex-start;
      }
      .scene {
        height: 640px;
        padding: 20px 32px;
        display: flex;
        flex-direction: column;
      }
      .row {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .label {
        font-weight: 600;
      }
      .arrow {
        color: #6b7280;
        font-size: 16px;
        text-align: center;
      }
      .arrow b {
        display: block;
        font-size: 40px;
        color: #111827;
      }
      .phone {
        height: 460px;
      }
      .menu-btn {
        margin-right: 12px;
        font-weight: 400;
      }
      .shade {
        position: absolute;
        inset: 0;
        background: rgba(17, 24, 39, 0.45);
      }
      .drawer {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 72%;
        background: #ffffff;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .drawer div {
        padding: 10px 12px;
        border-radius: 10px;
      }
      .drawer .on {
        background: #dbeafe;
        color: #1d4ed8;
        font-weight: 600;
      }
      .drawer .sep {
        height: 1px;
        padding: 0;
        background: #e5e7eb;
        margin: 6px 0;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="row">
        <div class="col">
          <span class="label">Cerrado</span>
          <div class="phone">
            <div class="header"><span class="menu-btn">&#9776;</span>Inicio</div>
            <div class="content"><div class="hero"></div><div class="line"></div><div class="line"></div><div class="line short"></div></div>
          </div>
        </div>
        <div class="arrow"><b>&#8594;</b>toca &#9776;</div>
        <div class="col">
          <span class="label">Abierto</span>
          <div class="phone">
            <div class="header"><span class="menu-btn">&#9776;</span>Inicio</div>
            <div class="content"><div class="hero"></div><div class="line"></div><div class="line"></div><div class="line short"></div></div>
            <div class="shade"></div>
            <div class="drawer">
              <div class="on">Inicio</div><div>Pedidos</div><div>Favoritos</div>
              <div class="sep"></div><div>Configuración</div><div>Ayuda</div>
            </div>
          </div>
        </div>
      </div>
      <div class="caption">Menú lateral para secciones secundarias, oculto hasta tocar &#9776;</div>
    </div>
  </body>
</html>

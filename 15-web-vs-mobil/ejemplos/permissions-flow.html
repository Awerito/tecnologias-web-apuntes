<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Permissions</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #ffffff;
        font-family: system-ui, sans-serif;
        font-size: 18px;
        color: #111827;
        width: 1200px;
        height: 640px;
        overflow: hidden;
      }
      .compare {
        display: flex;
        height: 640px;
      }
      .half {
        flex: 1;
        padding: 20px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .half + .half {
        border-left: 1px solid #e5e7eb;
      }
      .badge {
        align-self: flex-start;
        padding: 4px 16px;
        border-radius: 999px;
        font-weight: 600;
      }
      .bad {
        background: #fee2e2;
        color: #b91c1c;
      }
      .good {
        background: #dcfce7;
        color: #15803d;
      }
      .neutral {
        background: #e5e7eb;
        color: #374151;
      }
      .phone {
        position: relative;
        width: 280px;
        height: 500px;
        margin-top: 12px;
        border: 8px solid #111827;
        border-radius: 36px;
        overflow: hidden;
        background: #ffffff;
        display: flex;
        flex-direction: column;
      }
      .header {
        padding: 14px 16px;
        border-bottom: 1px solid #e5e7eb;
        font-weight: 700;
      }
      .content {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .item {
        padding: 14px;
        border-radius: 12px;
        background: #f3f4f6;
      }
      .line {
        height: 14px;
        background: #f3f4f6;
        border-radius: 6px;
      }
      .line.short {
        width: 60%;
      }
      .hero {
        height: 110px;
        background: #e5e7eb;
        border-radius: 12px;
      }
      .tabs {
        display: flex;
        margin-top: auto;
        border-top: 1px solid #e5e7eb;
        background: #f3f4f6;
      }
      .tabs span {
        flex: 1;
        text-align: center;
        font-size: 14px;
        padding: 14px 0;
        color: #6b7280;
      }
      .tabs .active {
        color: #2563eb;
        font-weight: 700;
      }
      .caption {
        margin-top: auto;
        color: #6b7280;
        font-size: 22px;
        align-self: flex-start;
      }
      .scene {
        height: 640px;
        padding: 20px 32px;
        display: flex;
        flex-direction: column;
      }
      .row {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .label {
        font-weight: 600;
      }
      .arrow {
        color: #6b7280;
        font-size: 16px;
        text-align: center;
      }
      .arrow b {
        display: block;
        font-size: 40px;
        color: #111827;
      }
      .splash {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 700;
        color: #d1d5db;
      }
      .shade {
        position: absolute;
        inset: 0;
        background: rgba(17, 24, 39, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sys {
        width: 84%;
        background: #ffffff;
        border-radius: 14px;
        padding: 16px;
        font-size: 15px;
        text-align: center;
      }
      .sys .actions {
        display: flex;
        justify-content: space-around;
        margin-top: 14px;
        color: #2563eb;
        font-weight: 600;
      }
      .explain {
        flex: 1;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 16px;
      }
      .qr {
        width: 110px;
        height: 110px;
        border: 4px dashed #9ca3af;
        border-radius: 14px;
        margin-top: 24px;
      }
      .cta {
        margin-top: auto;
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="compare">
      <div class="half">
        <span class="badge bad">Mal</span>
        <div class="phone">
          <div class="splash">MiApp</div>
          <div class="shade"><div class="sys">¿Permitir que MiApp use la cámara?<div class="actions"><span>No</span><span>Permitir</span></div></div></div>
        </div>
        <div class="caption">Pide la cámara apenas abre, sin contexto</div>
      </div>
      <div class="half">
        <span class="badge good">Bien</span>
        <div class="phone">
          <div class="header">Pagar con QR</div>
          <div class="explain"><div class="qr"></div>La cámara se usa para leer el código QR del local<div class="cta">Activar cámara</div></div>
        </div>
        <div class="caption">Explica para qué y pide al momento de usarla</div>
      </div>
    </div>
  </body>
</html>

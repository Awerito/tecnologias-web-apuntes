<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Stack navigation</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #ffffff;
        font-family: system-ui, sans-serif;
        font-size: 18px;
        color: #111827;
        width: 1200px;
        height: 640px;
        overflow: hidden;
      }
      .compare {
        display: flex;
        height: 640px;
      }
      .half {
        flex: 1;
        padding: 20px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .half + .half {
        border-left: 1px solid #e5e7eb;
      }
      .badge {
        align-self: flex-start;
        padding: 4px 16px;
        border-radius: 999px;
        font-weight: 600;
      }
      .bad {
        background: #fee2e2;
        color: #b91c1c;
      }
      .good {
        background: #dcfce7;
        color: #15803d;
      }
      .neutral {
        background: #e5e7eb;
        color: #374151;
      }
      .phone {
        position: relative;
        width: 280px;
        height: 500px;
        margin-top: 12px;
        border: 8px solid #111827;
        border-radius: 36px;
        overflow: hidden;
        background: #ffffff;
        display: flex;
        flex-direction: column;
      }
      .header {
        padding: 14px 16px;
        border-bottom: 1px solid #e5e7eb;
        font-weight: 700;
      }
      .content {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .item {
        padding: 14px;
        border-radius: 12px;
        background: #f3f4f6;
      }
      .line {
        height: 14px;
        background: #f3f4f6;
        border-radius: 6px;
      }
      .line.short {
        width: 60%;
      }
      .hero {
        height: 110px;
        background: #e5e7eb;
        border-radius: 12px;
      }
      .tabs {
        display: flex;
        margin-top: auto;
        border-top: 1px solid #e5e7eb;
        background: #f3f4f6;
      }
      .tabs span {
        flex: 1;
        text-align: center;
        font-size: 14px;
        padding: 14px 0;
        color: #6b7280;
      }
      .tabs .active {
        color: #2563eb;
        font-weight: 700;
      }
      .caption {
        margin-top: auto;
        color: #6b7280;
        font-size: 22px;
        align-self: flex-start;
      }
      .scene {
        height: 640px;
        padding: 20px 32px;
        display: flex;
        flex-direction: column;
      }
      .row {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .label {
        font-weight: 600;
      }
      .arrow {
        color: #6b7280;
        font-size: 16px;
        text-align: center;
      }
      .arrow b {
        display: block;
        font-size: 40px;
        color: #111827;
      }
      .back {
        color: #2563eb;
        font-weight: 400;
        margin-right: 12px;
      }
      .price {
        font-size: 32px;
        font-weight: 700;
        text-align: center;
        margin-top: 120px;
      }
      .price small {
        display: block;
        font-size: 22px;
        color: #15803d;
      }
      .phone {
        height: 460px;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="row">
        <div class="col">
          <span class="label">Lista</span>
          <div class="phone">
            <div class="header">Lista</div>
            <div class="content">
              <div class="item">Empanada</div>
              <div class="item">Completo</div>
              <div class="item">Sopaipilla</div>
            </div>
          </div>
        </div>
        <div class="arrow"><b>&#8594;</b>toca Empanada<br /><b>&#8592;</b>atrás</div>
        <div class="col">
          <span class="label">Detalle</span>
          <div class="phone">
            <div class="header"><span class="back">&#8249; Lista</span>Detalle</div>
            <div class="price">Empanada<small>$2500</small></div>
          </div>
        </div>
      </div>
      <div class="caption">Detalle se apila sobre Lista, atrás vuelve a la pantalla anterior</div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>User feedback</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #ffffff;
        font-family: system-ui, sans-serif;
        font-size: 18px;
        color: #111827;
        width: 1200px;
        height: 640px;
        overflow: hidden;
      }
      .compare {
        display: flex;
        height: 640px;
      }
      .half {
        flex: 1;
        padding: 20px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .half + .half {
        border-left: 1px solid #e5e7eb;
      }
      .badge {
        align-self: flex-start;
        padding: 4px 16px;
        border-radius: 999px;
        font-weight: 600;
      }
      .bad {
        background: #fee2e2;
        color: #b91c1c;
      }
      .good {
        background: #dcfce7;
        color: #15803d;
      }
      .neutral {
        background: #e5e7eb;
        color: #374151;
      }
      .phone {
        position: relative;
        width: 280px;
        height: 500px;
        margin-top: 12px;
        border: 8px solid #111827;
        border-radius: 36px;
        overflow: hidden;
        background: #ffffff;
        display: flex;
        flex-direction: column;
      }
      .header {
        padding: 14px 16px;
        border-bottom: 1px solid #e5e7eb;
        font-weight: 700;
      }
      .content {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .item {
        padding: 14px;
        border-radius: 12px;
        background: #f3f4f6;
      }
      .line {
        height: 14px;
        background: #f3f4f6;
        border-radius: 6px;
      }
      .line.short {
        width: 60%;
      }
      .hero {
        height: 110px;
        background: #e5e7eb;
        border-radius: 12px;
      }
      .tabs {
        display: flex;
        margin-top: auto;
        border-top: 1px solid #e5e7eb;
        background: #f3f4f6;
      }
      .tabs span {
        flex: 1;
        text-align: center;
        font-size: 14px;
        padding: 14px 0;
        color: #6b7280;
      }
      .tabs .active {
        color: #2563eb;
        font-weight: 700;
      }
      .caption {
        margin-top: auto;
        color: #6b7280;
        font-size: 22px;
        align-self: flex-start;
      }
      .scene {
        height: 640px;
        padding: 20px 32px;
        display: flex;
        flex-direction: column;
      }
      .row {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .label {
        font-weight: 600;
      }
      .arrow {
        color: #6b7280;
        font-size: 16px;
        text-align: center;
      }
      .arrow b {
        display: block;
        font-size: 40px;
        color: #111827;
      }
      .phone {
        width: 230px;
        height: 420px;
        border-width: 7px;
        border-radius: 30px;
      }
      .center {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .spinner {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 6px solid #e5e7eb;
        border-top-color: #2563eb;
      }
      .sk {
        background: #e5e7eb;
      }
      .toast {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 20px;
        padding: 12px 16px;
        border-radius: 10px;
        background: #111827;
        color: #ffffff;
        font-size: 15px;
      }
      .shade {
        position: absolute;
        inset: 0;
        background: rgba(17, 24, 39, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dialog {
        width: 82%;
        background: #ffffff;
        border-radius: 14px;
        padding: 16px;
        font-size: 15px;
      }
      .dialog b {
        display: block;
        margin-bottom: 14px;
      }
      .dialog .actions {
        display: flex;
        justify-content: flex-end;
        gap: 16px;
        color: #2563eb;
        font-weight: 600;
      }
      .dialog .danger {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="row" style="gap: 18px">
        <div class="col"><span class="label">Spinner</span><div class="phone"><div class="header">Pedidos</div><div class="center"><div class="spinner"></div></div></div></div>
        <div class="col"><span class="label">Skeleton</span><div class="phone"><div class="header">Pedidos</div><div class="content"><div class="hero sk"></div><div class="line sk"></div><div class="line sk short"></div><div class="hero sk"></div></div></div></div>
        <div class="col"><span class="label">Toast</span><div class="phone"><div class="header">Pedidos</div><div class="content"><div class="item">Empanada x2</div><div class="item">Completo x1</div></div><div class="toast">Pedido guardado</div></div></div>
        <div class="col"><span class="label">Dialog</span><div class="phone"><div class="header">Pedidos</div><div class="content"><div class="item">Empanada x2</div><div class="item">Completo x1</div></div><div class="shade"><div class="dialog"><b>¿Eliminar pedido?</b><div class="actions"><span>Cancelar</span><span class="danger">Eliminar</span></div></div></div></div></div>
      </div>
      <div class="caption">Cada acción responde: cargando, guardado o confirmación</div>
    </div>
  </body>
</html>

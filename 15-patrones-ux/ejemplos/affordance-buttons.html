<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Affordances</title>
<style>
  body { margin: 0; background: #ffffff; font-family: system-ui, sans-serif; font-size: 18px; color: #111827; }
  .compare { display: flex; width: 1200px; height: 640px; }
  .half { flex: 1; position: relative; padding: 72px 56px 40px; box-sizing: border-box; display: flex; flex-direction: column; }
  .half.bad { border-right: 1px solid #e5e7eb; }
  .badge { position: absolute; top: 20px; left: 24px; padding: 6px 16px; border-radius: 999px; font-weight: 700; font-size: 18px; }
  .bad .badge { background: #fee2e2; color: #b91c1c; }
  .good .badge { background: #dcfce7; color: #15803d; }
  .product { display: flex; gap: 28px; flex: 1; align-items: center; }
  .thumb { width: 200px; height: 200px; border-radius: 12px; background: #f3f4f6; flex: none; }
  .info h2 { margin: 0 0 6px; font-size: 28px; }
  .price { color: #6b7280; margin: 0 0 28px; font-size: 22px; }
  .actions { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
  .plain { font-size: 20px; color: #111827; }
  .btn-primary { font-size: 20px; padding: 12px 24px; border-radius: 8px; font-weight: 600; background: #2563eb; color: #ffffff; box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35); }
  .link { font-size: 20px; color: #2563eb; text-decoration: underline; }
  .caption { margin: 0; font-size: 22px; color: #6b7280; text-align: center; }
</style>
</head>
<body>
<div class="compare">
  <div class="half bad">
    <span class="badge">Mal</span>
    <div class="product">
      <div class="thumb"></div>
      <div class="info">
        <h2>Zapatillas Urban</h2>
        <p class="price">$49.990</p>
        <div class="actions">
          <span class="plain">Agregar al carrito</span>
          <span class="plain">Guía de tallas</span>
        </div>
      </div>
    </div>
    <p class="caption">Nada parece clickeable</p>
  </div>
  <div class="half good">
    <span class="badge">Bien</span>
    <div class="product">
      <div class="thumb"></div>
      <div class="info">
        <h2>Zapatillas Urban</h2>
        <p class="price">$49.990</p>
        <div class="actions">
          <span class="btn-primary">Agregar al carrito</span>
          <span class="link">Guía de tallas</span>
        </div>
      </div>
    </div>
    <p class="caption">El botón parece botón, el enlace parece enlace</p>
  </div>
</div>
</body>
</html>

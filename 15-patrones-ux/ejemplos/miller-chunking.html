<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ley de Miller</title>
<style>
  body { margin: 0; background: #ffffff; font-family: system-ui, sans-serif; font-size: 18px; color: #111827; }
  .compare { display: flex; width: 1200px; height: 640px; }
  .half { flex: 1; position: relative; padding: 80px 56px 36px; box-sizing: border-box; display: flex; flex-direction: column; }
  .half.bad { border-right: 1px solid #e5e7eb; }
  .badge { position: absolute; top: 20px; left: 24px; padding: 6px 16px; border-radius: 999px; font-weight: 700; font-size: 18px; }
  .bad .badge { background: #fee2e2; color: #b91c1c; }
  .good .badge { background: #dcfce7; color: #15803d; }
  .fields { flex: 1; display: flex; flex-direction: column; gap: 22px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; color: #6b7280; }
  .field { display: block; height: 64px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0 20px; box-sizing: border-box; line-height: 62px; background: #f3f4f6; font-family: ui-monospace, monospace; font-size: 28px; letter-spacing: 1px; }
  .caption { margin-top: 12px; font-size: 22px; color: #6b7280; text-align: center; }
</style>
</head>
<body>
<div class="compare">
  <div class="half bad">
    <span class="badge">Mal</span>
    <div class="fields">
      <div><label>RUT</label><span class="field">123456785</span></div>
      <div><label>Tarjeta</label><span class="field">4111111111111111</span></div>
      <div><label>Teléfono</label><span class="field">+56912345678</span></div>
    </div>
    <p class="caption">Una tira de dígitos, imposible de verificar de un vistazo</p>
  </div>
  <div class="half good">
    <span class="badge">Bien</span>
    <div class="fields">
      <div><label>RUT</label><span class="field">12.345.678-5</span></div>
      <div><label>Tarjeta</label><span class="field">4111 1111 1111 1111</span></div>
      <div><label>Teléfono</label><span class="field">+56 9 1234 5678</span></div>
    </div>
    <p class="caption">Bloques cortos, se leen y se recuerdan</p>
  </div>
</div>
</body>
</html>

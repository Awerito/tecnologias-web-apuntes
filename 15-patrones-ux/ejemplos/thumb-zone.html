<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Thumb zone</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #ffffff;
        font-family: system-ui, sans-serif;
        font-size: 18px;
        color: #111827;
        width: 1200px;
        height: 640px;
        overflow: hidden;
      }
      .compare {
        display: flex;
        height: 640px;
      }
      .half {
        flex: 1;
        padding: 20px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .half + .half {
        border-left: 1px solid #e5e7eb;
      }
      .badge {
        align-self: flex-start;
        padding: 4px 16px;
        border-radius: 999px;
        font-weight: 600;
      }
      .bad {
        background: #fee2e2;
        color: #b91c1c;
      }
      .good {
        background: #dcfce7;
        color: #15803d;
      }
      .phone {
        position: relative;
        width: 280px;
        height: 500px;
        margin-top: 12px;
        border: 8px solid #111827;
        border-radius: 36px;
        overflow: hidden;
        background: #ffffff;
        display: flex;
        flex-direction: column;
      }
      .tabs {
        display: flex;
        background: #f3f4f6;
      }
      .tabs span {
        flex: 1;
        text-align: center;
        font-size: 14px;
        padding: 10px 0;
        color: #6b7280;
      }
      .tabs .active {
        color: #2563eb;
        font-weight: 700;
      }
      .top-tabs span {
        font-size: 13px;
        padding: 8px 0;
      }
      .top-tabs .active {
        border-bottom: 2px solid #2563eb;
      }
      .bottom-tabs {
        margin-top: auto;
        border-top: 1px solid #e5e7eb;
      }
      .bottom-tabs span {
        padding: 14px 0;
      }
      .content {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .content .hero {
        height: 120px;
        background: #e5e7eb;
        border-radius: 12px;
      }
      .content .line {
        height: 14px;
        background: #f3f4f6;
        border-radius: 6px;
      }
      .content .line.short {
        width: 60%;
      }
      .reach {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse 80% 60% at 50% 66%,
          rgba(34, 197, 94, 0.4) 0,
          rgba(34, 197, 94, 0.4) 30%,
          rgba(234, 179, 8, 0.3) 52%,
          rgba(239, 68, 68, 0.38) 78%
        );
      }
      .caption {
        margin-top: auto;
        color: #6b7280;
        font-size: 22px;
        align-self: flex-start;
      }
    </style>
  </head>
  <body>
    <div class="compare">
      <div class="half">
        <span class="badge bad">Mal</span>
        <div class="phone">
          <div class="tabs top-tabs">
            <span class="active">Inicio</span><span>Buscar</span
            ><span>Carrito</span><span>Perfil</span>
          </div>
          <div class="content">
            <div class="hero"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line short"></div>
            <div class="hero"></div>
            <div class="line"></div>
            <div class="line short"></div>
          </div>
          <div class="reach"></div>
        </div>
        <div class="caption">Menú arriba, fuera del alcance del pulgar</div>
      </div>
      <div class="half">
        <span class="badge good">Bien</span>
        <div class="phone">
          <div class="content">
            <div class="hero"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line short"></div>
            <div class="hero"></div>
            <div class="line"></div>
            <div class="line short"></div>
          </div>
          <div class="tabs bottom-tabs">
            <span class="active">Inicio</span><span>Buscar</span
            ><span>Carrito</span><span>Perfil</span>
          </div>
          <div class="reach"></div>
        </div>
        <div class="caption">Barra inferior, dentro del alcance</div>
      </div>
    </div>
  </body>
</html>
